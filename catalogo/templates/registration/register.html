{% extends 'catalogo/base.html' %}

{% block title %}Registrarse - Vinoteca Don Lucas{% endblock title %}

{% block content %}
<div class="form-card">
    <h3>Crear una Cuenta</h3>
    
    <form method="post" enctype="multipart/form-data" id="register-form">
        {% csrf_token %}
        {{ form.as_p }}
        
        <div class="form-actions" style="flex-direction: column; gap: 0.75rem;">
            <button type="submit" class="btn-save" id="btn-submit-register">Crear Cuenta</button>
            <p style="text-align: center; margin-top: 1rem; font-size: 0.95rem;">
                ¿Ya tienes una cuenta? <a href="{% url 'login' %}" style="color: var(--color-primary); font-weight: 600; text-decoration: none;">Inicia sesión aquí</a>
            </p>
        </div>
    </form>
</div>
{% endblock content %}
